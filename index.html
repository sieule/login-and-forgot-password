<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title data-i18n="page_title">Đăng nhập</title>
    <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Nút quay về trang chủ -->
    <a href="/" class="home-btn" aria-label="Back to home">
        <i class="bi bi-arrow-left"></i>
        <span data-i18n="back_home">Về trang chủ</span>
    </a>

    <!-- Bộ chọn ngôn ngữ -->
    <div class="lang-switcher">
        <select id="langSelect" aria-label="Chọn ngôn ngữ">
            <option value="vi">🇻🇳 Tiếng Việt</option>
            <option value="en">🇬🇧 English</option>
            <option value="ja">🇯🇵 日本語</option>
        </select>
    </div>

    <div class="container">
        <div class="box hopdangnhap">
            <div class="details dtdangnhap">
                <h2 data-i18n="login_title">Đăng nhập</h2>
                <div class="box-wrapper">
                    <label for="usernamedn" data-i18n="username">Tên đăng nhập</label>
                    <input type="text" id="usernamedn" data-i18n-placeholder="username" placeholder="Tên đăng nhập" required>
                </div>
                <div class="box-wrapper">
                    <label for="passworddn" data-i18n="password">Mật khẩu</label>
                    <span toggle="#passworddn" class="field-icon"><i class="bi bi-eye-fill"></i></span>
                    <input type="password" id="passworddn" data-i18n-placeholder="password" placeholder="Mật khẩu" required>
                </div>
                <table border="0" width="100%">
                    <tr>
                        <td width="6%"><input id="remember" class="remember" type="checkbox"></td>
                        <td width="50%" data-i18n="remember_me">Ghi nhớ đăng nhập</td>
                        <td width="44%" style="text-align: right;">
                            <a href="#" data-i18n="need_help">Cần hỗ trợ?</a>
                        </td>
                    </tr>
                </table>
                <button id="login" data-i18n="login_btn">Đăng nhập</button>
                <p>
                    <span data-i18n="forgot_password">Quên mật khẩu?</span>
                    <a href="#" id="nhayphai" data-i18n="reset_link">Đặt lại</a>
                </p>
            </div>

            <div class="hopdangky">
                <div class="details dtdangky">
                    <h2 data-i18n="reset_title">Đặt lại mật khẩu</h2>
                    <p data-i18n="reset_desc">Vui lòng điền 1 trong 2 thông tin dưới đây để đặt lại mật khẩu.</p>
                    <div class="box-wrapper">
                        <label for="usernameqmk" data-i18n="username">Tên đăng nhập</label>
                        <input type="text" id="usernameqmk" data-i18n-placeholder="username" placeholder="Tên đăng nhập" required>
                    </div>
                    <div class="box-wrapper">
                        <label for="emailqmk" data-i18n="email">Địa chỉ email</label>
                        <input type="email" id="emailqmk" data-i18n-placeholder="email" placeholder="Địa chỉ email" required>
                    </div>
                    <button id="register" data-i18n="reset_btn">Đặt lại</button>
                    <p>
                        <span data-i18n="remembered_password">Đã nhớ mật khẩu?</span>
                        <a href="#" id="nhaytrai" data-i18n="login_link">Đăng nhập</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div id="register-error-popup" class="popup">
        <div class="popup-content">
            <span id="closePopupBtn" class="close-btn">&times;</span>
            <div class="popup-message">
                <i class="bi bi-exclamation-triangle-fill error-icon"></i>
                <p id="register-error-message" style="color: red;"></p>
            </div>
        </div>
    </div>
</body>
</html>
